			default: `app_options.html?page=${page}&device=${device}&version=${version}&app=${app}`
		  };
		  
		  url = homeContent[page] || homeContent.default;
		  window.location.href = url;
		};
		
		// Proceed to app page
		window.handleOption = function(option) {
			if (!option) return;
			// let url = `app_guide.html?page=${page}&device=${device}&version=${version}&app=${app}&app_option=${option}`;
			let url = `help_guide.html?page=${page}&device=${device}&version=${version}&app=${app}&problem=${option}`;

		};

                const placeholder = this.nextElementSibling;
                if (placeholder && placeholder.classList.contains('image-placeholder')) {
                    placeholder.style.display = 'block';
                }
            };

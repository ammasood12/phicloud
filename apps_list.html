	// Function to generate apps HTML for a device
	function generateDeviceAppsHTML(deviceConfig, deviceKey, showHeader = false) {
		let html = '';
		
		if (showHeader) {
			html += `
				<div style="margin: 30px 0 15px 0;">
					<h2 style="display: flex; align-items: center; gap: 10px; color: #1e293b;">
						<i class="${deviceConfig.icon}" style="color: #818bff;"></i>
						${deviceConfig.name} Apps
					</h2>
				</div>
			`;
		}
		
		const filteredApps = deviceConfig.apps.filter(app => app.type === 'app');
		
		// enable section-head and share-option for non-download pages
		if (page !== 'downloads') {
			html += `
				<div class="section-title">
					<div class="section-title-left">
						<i class="fas fa-info-circle"></i>					
						<span>Select App <b style="color: #818bff;">
						${page === 'help' 
							? 'to Solve Problem' 
							: 'for Detailed Guide'}
						</b></span>
					</div>
					<i class="fas fa-share-alt share-icon" onclick="copyPageLink()" title="Copy link to this page"></i>
				</div>`;
		}
		
		html += `<div class="apps-grid">`;
		filteredApps.forEach(app => {
			// Determine the link based on deviceKey
			let link = '';
			// Generate link based on connectivity app (only downloadable apps excluded)
			if (deviceKey === 'other') {
				link = '';
			} else {
				link = `app=${app.page}&device=${deviceKey}&version=${app.version || ''}`;
			}
			
			// Get version using bracket notation
			// const versionNumber = APP_VERSIONS[app.page];
			//const versionText = versionNumber ? `v${versionNumber}` : `${app.version}`;
			// const versionText = versionNumber ? `v${versionNumber}` : `–––`;
			// const versionDisplay = (versionText) 
				// ? `<span class="device-badge">${versionText}</span>` 
				// : '';
			
			// Get release date
			// const releaseDate = getReleaseDate(app.page);
			// const dateText = releaseDate ? `<span class="release-date">📅 ${releaseDate}</span>` : '';
			// For downloads page, also show release date
			// const dateDisplay = (releaseDate) 
				// ? `<div class="release-info">Updated at: ${releaseDate}</div>` 
				// : '';

			html += `
				<div>            
					<div class="device-card ${app.recommended === true ? 'recommended' : ''}" onclick="handleProceed('${link}')" id="card-${app.title}">
						<div class="card-image-wrapper">
							<img src="${app.image}" alt="${app.title}" class="app-logo">
						</div>
						<span class="device-badge-colored" ${deviceKey === 'mac' ? 'style="color:;"' : ''}> ${app.caption || ''}</span>
						<h3>${app.title}</h3>
						${(page === 'downloads' && deviceKey !== 'other') 
							? `
								<span class="device-badge">v${getAppVersion(app.page, deviceKey) || '0.0'}</span>
								<div class="release-info">${deviceKey === 'ios' ? 'Checked at:' : 'Updated at:'} ${getReleaseDate(app.page, deviceKey)}</div>
							`
							: ``
						}
					</div>
					${page === 'downloads' 
						? `	
							${deviceKey !== 'other' ? 
							`
								<a href="${getDownloadLink(app.page, deviceKey, app.version, 'proxy')}" target="_blank">
									<button class="device-card btn-download-small">Download Link 1</button></a>
								<a href="${getDownloadLink(app.page, deviceKey, app.version, 'noproxy')}" target="_blank">
									<button class="device-card btn-download-small">Download Link 2</button></a>
								<a href="${getWebsiteLink(app.page)}" target="_blank">
									<button class="device-card btn-website-small website">Website</button></a>
							` : `
								<a href="${getDownloadLink(app.page, deviceKey, app.version, 'noproxy')}" target="_blank">
									<button class="device-card btn-download-small">Download Link</button></a>
								<a href="${getWebsiteLink(app.page)}" target="_blank">
									<button class="device-card btn-website-small website">Website</button></a>
							`}
						`: ``
					}
				</div>
			`;
		});
				
		// Show other account services
		const showServices = false;
		if (page !== 'downloads' && page !== 'guide' && showServices) {
			const otherServices = deviceConfig.apps.filter(app => app.type === 'service');
			otherServices.forEach(app => {
				// Determine the link based on deviceKey
				let link = `app=${app.page}&device=${deviceKey}&version=${app.version || ''}`;

				html += `
					<div>            
						<div class="device-card" onclick="handleProceed('${link}')" id="card-${app.title}">
							<div class="card-image-wrapper">

							</div>
							<h3>${app.title}</h3>                                                
							<span class="device-badge">${deviceConfig.name} ${app.caption || ''}</span>
						</div>
					</div>
				`;
			});
		}
		
		html += `</div>`;
		
		return html;

	// Determine which devices to show
	let headerConfig;

	if (page === 'downloads') {
		// Show all devices
		headerConfig = {

		};
		
		// Generate sections for each device
		Object.keys(configs).forEach(deviceKey => {
			contentHtml += generateDeviceAppsHTML(configs[deviceKey], deviceKey, true);
		});
	} else {
		// Show single device
		const deviceConfig = configs[device] || configs.android;
		if (page === 'help') {
			headerConfig = {
				name: deviceConfig.name + ' Help',
				icon: deviceConfig.icon
			}
		} else {
			headerConfig = {
				name: deviceConfig.name + ' Guide',
				icon: deviceConfig.icon
			}
		};
		
		contentHtml = generateDeviceAppsHTML(deviceConfig, device, false);
	}

	// Set header
	document.getElementById('header').innerHTML = `

			${page === 'downloads' 
				? '<i class="fa-solid fa-home"></i> Home' 
				: page === 'help' 
					? '<i class="fa-solid fa-wrench"></i> Help' 
					:'<i class="fa-solid fa-book-open"></i> Guide'
			}
		</button>
		
		<div class="header-center">
			<div class="header-icon"><i class="${headerConfig.icon}"></i></div>
			<div>
				<h1>${headerConfig.name}</h1>					
			</div>
		</div>
		
		<div class="next-btn-placeholder"></div>
	`;

	// Set content
	document.getElementById('content').innerHTML = contentHtml;

		
		window.goHome = function() {
			let url;

			const homeContent = {			  			
				downloads: `index.html`,
				help: `help.html`,
				guide: `guide.html`,
				default: `guide.html`
			};

			url = homeContent[page] || homeContent.default;
			window.location.href = url;
		};
		
		// Proceed to app page
		window.handleProceed = function(appDetails) {
			if (!appDetails) return;
			let url = '';
			if (page === 'help') {
				url += `help_options.html?page=${page}&${appDetails}`;
			} else {		
				url += `app_options.html?page=${page}&${appDetails}`;
			}
			
			window.location.href = url;
		};

        // Handle image load errors
        document.querySelectorAll('.step-image').forEach(img => {
            img.onerror = function() {
                this.style.display = 'none';
                const placeholder = this.nextElementSibling;
                if (placeholder && placeholder.classList.contains('image-placeholder')) {
                    placeholder.style.display = 'block';
                }
            };
        });
		
		// Handle download button click with WeChat detection
		window.handleDownloadClick = function(downloadUrl) {
			if (typeof handleWeChatDownload === 'function') {
				handleWeChatDownload(downloadUrl);
			} else {
				// Fallback if function not available
				window.open(downloadUrl, '_blank');
			}
		};
	
	})();

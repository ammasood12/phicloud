		// Proceed to app page

		  if (!option) return;
		  
		  let url;
		  const handleContent = {			  				
			help: `help_options.html?page=${page}&device=${device}&version=${version}&app=${app}`,
			'connect-now': `app_guide.html?page=${page}&device=${device}&version=${version}&app=${app}&option=${option}`,
			default: `app_guide.html?page=${page}&device=${device}&version=${version}&app=${app}&app_option=${option}`
		  };
		  
		  url = handleContent[option] || handleContent.default;
		  window.location.href = url;
		};

            img.onerror = function() {
                this.style.display = 'none';
                const placeholder = this.nextElementSibling;
                if (placeholder && placeholder.classList.contains('image-placeholder')) {
                    placeholder.style.display = 'block';
                }

				// Update button states
				updateNavButtons();

				window.scrollTo({ top: 0, behavior: 'smooth' });
			}
		};

		// Handle substep next button
		window.handleSubstepNext = function () {
			if (currentStep === totalSubsteps - 1) {
				// Last substep - go back to previous page
				goBack();
			} else {
				navigateSubstepPage('next');
			}
		};

		// Handle substep back button
		window.handleSubstepBack = function () {
			if (currentStep === 0) {
				// First substep - go back to previous page
				goBack();
			} else {
				navigateSubstepPage('prev');
			}
		};

		// Handle top back button
		window.handleTopBack = function () {
			if (isSubstepMode) {
				if (currentStep === 0) {
					// First substep - go back to previous page
					goBack();
				} else {
					// Not first substep - go to previous substep
					navigateSubstepPage('prev');
				}
			} else {
				// Main step mode
				if (currentStep === 0) {
					goBack();
				} else {
					prevMainStep();
				}
			}
		};

		// Handle top next button
		window.handleTopNext = function () {
			if (isSubstepMode) {
				if (currentStep === totalSubsteps - 1) {
					// Last substep - go back to previous page
					goBack();
				} else {
					// Not last substep - go to next substep
					navigateSubstepPage('next');
				}
			} else {
				// Main step mode
				if (currentStep === filteredSteps.length - 1) {
					goBack();
				} else {
					nextMainStep();
				}
			}
		};

		// Navigate between main steps
		window.nextMainStep = function () {
			if (currentStep < filteredSteps.length - 1) {
				currentStep++;
				showStep(currentStep);
				updateNavButtons();
				window.scrollTo({ top: 0, behavior: 'smooth' });
			}
		};

		window.prevMainStep = function () {
			if (currentStep > 0) {
				currentStep--;
				showStep(currentStep);
				updateNavButtons();
				window.scrollTo({ top: 0, behavior: 'smooth' });
			}
		};

		// Override nextStep/prevStep for backward compatibility
		window.nextStep = handleTopNext;
		window.prevStep = handleTopBack;

		// get current step
		function getStep(app_option) {
			if (isSubstepMode) {
				return parseInt(substep) || 0;
			}
			const step_number = filteredSteps.findIndex(step => step.name === app_option);
			return step_number === -1 ? 0 : step_number;
		}

		// Show step
		let step_number = getStep(app_option);
		if (!isSubstepMode) {
			currentStep = step_number;
		}
		showStep(currentStep);

		// Update navigation buttons initially
		setTimeout(() => {
			updateNavButtons();
		}, 100);

		window.goBack = function () {
			// Go back to main options page
			let url = `help_options.html?page=${page}&device=${device}&version=${getVersion}&app=${app}`;
			window.location.href = url;
		};

		// Handle image load errors
		document.querySelectorAll('.step-image').forEach(img => {
			img.onerror = function () {
				this.style.display = 'none';
				this.insertAdjacentHTML('afterend', '<div class="image-placeholder"><i class="fas fa-image"></i><p>Image not available</p></div>');
			};
		});

		// Handle download button click with WeChat detection
		window.handleDownloadClick = function (downloadUrl) {
			if (typeof handleWeChatDownload === 'function') {
				handleWeChatDownload(downloadUrl);
			} else {
				// Fallback if function not available
				window.open(downloadUrl, '_blank');
			}
		};		

		window.handleWeChatCheck = function(event, downloadUrl) {
			// Check if WeChat
			if (typeof window.isInWeChat === 'function' && window.isInWeChat()) {
				event.preventDefault();
				if (typeof showWeChatMessage === 'function') {
					showWeChatMessage();
				} else if (typeof window.showWeChatMessage === 'function') {
					window.showWeChatMessage();
				}
				return false;
			}
			return true; // Allow normal navigation
		};


		})();
	</script>

</body>

</html>
